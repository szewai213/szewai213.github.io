<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GapSense - 全方位壓力消除</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --mint-primary: #10B981;
            --mint-dark: #064E3B;
            --mint-bg: #DCFCE7;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--mint-bg);
            color: var(--mint-dark);
            margin: 0; padding: 0;
            overflow: hidden;
            width: 100vw; height: 100vh;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
        }
        .nav-btn {
            transition: all 0.2s;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-btn.active {
            background: var(--mint-dark);
            color: white;
            transform: scale(1.05);
        }
        .game-canvas {
            width: 100%; height: 58vh;
            position: relative;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            background: var(--mint-bg);
        }

        /* --- 動態動畫 --- */
        @keyframes demoMonRotation { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes demoMonShooting { 0%, 15% { margin-top: 40px; opacity: 1; } 25% { margin-top: 0px; opacity: 1; } 25.1%, 100% { margin-top: 0px; opacity: 0; } }
        @keyframes demoMonStuckAppear { 0%, 24.9% { opacity: 0; transform: rotate(0deg); } 25%, 90% { opacity: 1; transform: rotate(-90deg); } 90.1%, 100% { opacity: 0; transform: rotate(-90deg); } }
        @keyframes demoTueLaser { 0% { width: 0; left: -10%; top: 50%; opacity: 0; } 10% { width: 0; left: -10%; top: 50%; opacity: 1; } 45% { width: 120%; left: 110%; top: 20%; opacity: 1; box-shadow: 0 0 20px #10B981, 0 0 10px white; } 55%, 100% { width: 120%; left: 110%; top: 20%; opacity: 0; } }
        @keyframes demoThuCamera { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); box-shadow: 0 0 20px #10B981; } }
        @keyframes demoSatSwipe { 0%, 20% { transform: translate(-50px, 0); opacity: 0; } 30% { transform: translate(-50px, 0); opacity: 1; } 70% { transform: translate(50px, 0); opacity: 1; } 80%, 100% { transform: translate(50px, 0); opacity: 0; } }
        @keyframes demoSatCloud { 0%, 40% { opacity: 1; filter: blur(2px); } 60%, 80% { opacity: 0; filter: blur(8px); } 90%, 100% { opacity: 1; filter: blur(2px); } }
        @keyframes demoSunCoin { 0% { top: -10%; left: 50%; opacity: 1; transform: translateX(-50%) rotate(0deg); } 100% { top: 90%; left: 50%; opacity: 0; transform: translateX(-50%) rotate(180deg); } }
        @keyframes demoSunBasket { 0%, 100% { left: 30%; } 50% { left: 50%; } }
        @keyframes countDownPop { 0% { transform: scale(0.3); opacity: 0; } 20% { transform: scale(1.1); opacity: 1; } 70% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
        @keyframes flyCoin { 0% { transform: scale(1) translate(0, 0); opacity: 1; } 100% { transform: scale(0.5) translate(var(--tx), var(--ty)); opacity: 0; } }
        @keyframes demoFriPumpSlow { 0% { transform: scale(0.6); } 25% { transform: scale(1.2); } 50% { transform: scale(1.8); } 75% { transform: scale(2.5); opacity: 1; } 85%, 100% { transform: scale(0); opacity: 0; } }
        @keyframes demoFriClickSlow { 0%, 25%, 50%, 75% { transform: translate(0,0) scale(1); } 12%, 37%, 62%, 80% { transform: translate(-10px, -10px) scale(0.8); } 85%, 100% { opacity: 0; } }
        @keyframes monHitElastic { 0% { transform: scale(1); } 40% { transform: scale(0.92); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
        .mon-hit-anim { animation: monHitElastic 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94); }

        /* 遊戲組件樣式 */
        .target-circle { width: 160px; height: 160px; border-radius: 50%; background: #e5e7eb; border: 6px solid #9ca3af; position: relative; z-index: 10; }
        .pen-stuck { position: absolute; width: 8px; top: 100%; left: 50%; margin-left: -4px; transform-origin: 50% -80px; z-index: 20; }
        .shooter-pen { position: absolute; width: 8px; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 100px; z-index: 30; }
        .pen-body { width: 6px; height: 45px; background: #10B981; margin: 0 auto; border-radius: 2px; }
        .pen-tip { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 12px solid #374151; margin: 0 auto; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .tabular-nums { font-variant-numeric: tabular-nums; }

        .balloon-knot {
            position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
            border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 16px solid #34D399;
            z-index: -1;
        }

        .flying-coin { position: fixed; width: 40px; height: 40px; z-index: 9999; pointer-events: none; animation: flyCoin 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; object-fit: contain; }
    </style>
</head>
<body class="flex flex-col">

    <!-- 頂部全域 Header -->
    <header class="p-4 shrink-0 text-center relative">
        <h1 class="text-3xl font-black tracking-tight uppercase">GapSense</h1>
        <p class="text-sm font-bold text-emerald-600 uppercase tracking-widest italic mb-4 mt-1">Weekly De-stress</p>
        
        <!-- 全域 Life Coins 錢包 -->
        <div class="absolute top-4 right-4 bg-white/90 px-3 py-1.5 rounded-full font-black text-emerald-800 flex items-center gap-2 shadow-md border border-emerald-100 z-50" id="wallet-ui">
            <div class="w-8 h-8 flex items-center justify-center"><img src="" id="wallet-coin-icon" class="w-full h-full object-contain drop-shadow-sm"></div>
            <span id="global-coins" class="text-lg">0</span>
        </div>

        <div class="flex justify-between gap-2 overflow-x-auto no-scrollbar max-w-sm mx-auto px-2">
            <div onclick="switchDay(1)" id="btn-1" class="nav-btn flex-1 py-3 glass-card font-black text-base">M</div>
            <div onclick="switchDay(2)" id="btn-2" class="nav-btn flex-1 py-3 glass-card font-black text-base">T</div>
            <div onclick="switchDay(3)" id="btn-3" class="nav-btn flex-1 py-3 glass-card font-black text-base">W</div>
            <div onclick="switchDay(4)" id="btn-4" class="nav-btn flex-1 py-3 glass-card font-black text-base">T</div>
            <div onclick="switchDay(5)" id="btn-5" class="nav-btn flex-1 py-3 glass-card font-black text-base">F</div>
            <div onclick="switchDay(6)" id="btn-6" class="nav-btn flex-1 py-3 glass-card font-black text-base">S</div>
            <div onclick="switchDay(7)" id="btn-7" class="nav-btn flex-1 py-3 glass-card font-black text-base">S</div>
        </div>
    </header>

    <main id="game-container" class="flex-1 flex flex-col items-center justify-between py-4 relative">
        <div id="game-scene" class="game-canvas"></div>
        <div class="w-full max-w-xs px-4 mb-6 z-40">
            <div class="glass-card p-4 flex justify-between items-center shadow-sm">
                <div id="status-box">
                    <p id="stat-label" class="text-sm text-emerald-700 font-black uppercase italic tracking-widest">Status</p>
                    <p id="stat-value" class="text-2xl font-black text-emerald-950 mt-1">Ready</p>
                </div>
            </div>
        </div>
    </main>

    <div id="countdown-overlay" class="fixed inset-0 bg-emerald-950/80 z-[2000] hidden flex-col items-center justify-center backdrop-blur-md">
        <div id="countdown-text" class="text-white text-[30vw] md:text-[10rem] font-black italic tracking-tighter"></div>
    </div>

    <div id="game-modal" class="modal-overlay">
        <div class="glass-card bg-white p-8 max-w-xs w-full text-center shadow-2xl relative overflow-hidden">
            <h3 id="modal-title" class="font-black text-2xl mb-3 text-emerald-900 relative z-10">任務完成</h3>
            <div id="modal-content" class="mb-4 text-lg font-semibold text-gray-600 leading-relaxed relative z-10"></div>
            <div id="modal-reward" class="hidden flex-col items-center justify-center mb-6 py-4 bg-emerald-50 rounded-xl border border-emerald-200 shadow-inner relative z-10">
                <p class="text-xs font-bold text-emerald-600 uppercase tracking-widest mb-2">獲得 Life Coins 獎勵</p>
                <div class="flex items-center gap-2 text-4xl font-black text-emerald-700">
                    <div class="w-16 h-16 flex items-center justify-center"><img src="" id="modal-coin-icon" class="w-full h-full object-contain drop-shadow-md"></div> <span id="modal-coin-amount">+0</span>
                </div>
            </div>
            <button id="modal-btn" class="w-full py-4 bg-emerald-600 text-white rounded-xl font-black text-xl active:scale-95 transition-transform relative z-10">繼續</button>
        </div>
    </div>

    <script>
        const apiKey = ""; 
        let currentDay = 1;
        let countdownTimer = null;
        
        // --- 高度還原 Life Coin SVG (修正為直角/銳利細節，非全圓弧) ---
        // 外弧: 使用 square linecap 讓邊緣銳利
        // L型指針: 使用 miter 確保轉角尖銳直角
        const lifeCoinSvgRaw = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="50" fill="#90A96B"/>
            <path d="M 85 50 A 35 35 0 1 1 50 15" fill="none" stroke="white" stroke-width="10" stroke-linecap="square"/>
            <path d="M 45 30 L 45 55 L 70 55" fill="none" stroke="white" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter"/>
        </svg>`;
        
        // 優先讀取您提供的 SVG 檔案，若檔案無法載入(不可見)則自動回退至修正後的 Base64
        const fallbackCoinSrc = 'data:image/svg+xml;base64,' + btoa(lifeCoinSvgRaw);
        const LIFE_COIN_SRC = encodeURI('工作區域 1.svg'); 
        
        // 初始化錢包與彈窗的圖標，加入 onerror 備援機制確保絕對可見
        const walletIcon = document.getElementById('wallet-coin-icon');
        walletIcon.onerror = () => { walletIcon.src = fallbackCoinSrc; };
        walletIcon.src = LIFE_COIN_SRC;

        const modalIcon = document.getElementById('modal-coin-icon');
        modalIcon.onerror = () => { modalIcon.src = fallbackCoinSrc; };
        modalIcon.src = LIFE_COIN_SRC;
        
        // 全域金幣管理
        let totalLifeCoins = parseInt(localStorage.getItem('gapSense_lifeCoins')) || 0;
        document.getElementById('global-coins').innerText = totalLifeCoins;

        function addLifeCoins(amount) {
            totalLifeCoins += amount;
            localStorage.setItem('gapSense_lifeCoins', totalLifeCoins);
            document.getElementById('global-coins').innerText = totalLifeCoins;
        }

        // 飛行動畫
        function animateCoinsToWallet(amount, startRect) {
            const walletRect = document.getElementById('wallet-ui').getBoundingClientRect();
            for(let i=0; i<Math.min(amount, 10); i++) {
                setTimeout(() => {
                    const coin = document.createElement('img');
                    coin.onerror = () => { coin.src = fallbackCoinSrc; };
                    coin.src = LIFE_COIN_SRC;
                    coin.className = 'flying-coin';
                    coin.style.left = `${startRect.left + startRect.width/2 - 20}px`;
                    coin.style.top = `${startRect.top + startRect.height/2 - 20}px`;
                    
                    const tx = walletRect.left + 10 - (startRect.left + startRect.width/2 - 20);
                    const ty = walletRect.top + 10 - (startRect.top + startRect.height/2 - 20);
                    coin.style.setProperty('--tx', `${tx}px`);
                    coin.style.setProperty('--ty', `${ty}px`);
                    
                    document.body.appendChild(coin);
                    setTimeout(() => coin.remove(), 800);
                }, i * 60);
            }
        }

        // Gemini API 呼叫
        async function callGemini(prompt, system = "You are a helpful assistant.", base64Image = null) {
            try {
                let parts = [{ text: prompt }];
                if (base64Image) {
                    const mimeType = base64Image.substring(5, base64Image.indexOf(';'));
                    const data = base64Image.split(',')[1];
                    parts.push({ inlineData: { mimeType: mimeType, data: data } });
                }
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ role: "user", parts: parts }], systemInstruction: { parts: [{ text: system }] } })
                });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "YES";
            } catch (error) { return "YES"; }
        }

        // 各日狀態
        let monState = 'setup', monLevel = 1, monPensLeft = 0, monLives = 3, monRotation = 0, monStuckAngles = [], monBossImg = null, monIsShooting = false, monAnimId = null, monFrameCount = 0;
        let tueAnimId = null, tueCanvas, tueCtx, tueState = 'setup', tueScore = 0, tueHighScore = parseInt(localStorage.getItem('gapSense_tueHigh')) || 0, tueLives = 3, tueEnvelopes = [], tueParticles = [], tueTrail = [], tueIsSwiping = false, tueFrameCount = 0;
        let wedAnimId = null, wedState = 'setup', wedLevel = 1, wedTargets = [5, 7, 15], wedStartTime = 0, wedIsPressing = false;
        let thuState = 'setup', thuScore = 0;
        let friState = 'setup', friPopProgress = 0, friIsExploded = false, friTargetImg = null, friAnimId = null;
        let satState = 'setup', satCanvas, satCtx, satIsSwiping = false, satCoinsCollected = 0, satTotalCoins = 0, satCoins = [], satWindParticles = [], satLastPos = null;
        let sunAnimId = null, sunCanvas, sunCtx, sunState = 'setup', sunScore = 0, sunLives = 3, sunCoins = [], sunBasketX = 0, sunFrameCount = 0;

        function startCountdown(callback) {
            const overlay = document.getElementById('countdown-overlay'); const text = document.getElementById('countdown-text');
            overlay.style.display = 'flex'; let count = 3;
            const animateText = (str) => { text.innerText = str; text.style.animation = 'none'; void text.offsetWidth; text.style.animation = 'countDownPop 1s ease-in-out forwards'; };
            animateText(count);
            if(countdownTimer) clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                count--;
                if (count > 0) animateText(count);
                else if (count === 0) animateText("GO!");
                else { clearInterval(countdownTimer); overlay.style.display = 'none'; callback(); }
            }, 1000);
        }

        function switchDay(day) {
            currentDay = day;
            cancelAnimationFrame(monAnimId); cancelAnimationFrame(tueAnimId); cancelAnimationFrame(wedAnimId); cancelAnimationFrame(friAnimId); cancelAnimationFrame(sunAnimId);
            if (countdownTimer) clearInterval(countdownTimer);
            document.getElementById('countdown-overlay').style.display = 'none';
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${day}`); if(activeBtn) activeBtn.classList.add('active');
            monState = 'setup'; tueState = 'setup'; wedState = 'setup'; thuState = 'setup'; friState = 'setup'; satState = 'setup'; sunState = 'setup';
            render();
        }

        function render() {
            const scene = document.getElementById('game-scene'); const statValue = document.getElementById('stat-value'); const statLabel = document.getElementById('stat-label');
            scene.innerHTML = '';
            if (currentDay === 1) { renderMonday(scene); statLabel.innerText = "LEVEL"; statValue.innerText = monState === 'setup' ? "READY" : `${monLevel} / 3`; } 
            else if (currentDay === 2) { renderTuesday(scene); statLabel.innerText = "SCORE | BEST"; statValue.innerText = tueState === 'setup' ? `0 | ${tueHighScore}` : `${tueScore} | ${tueHighScore}`; } 
            else if (currentDay === 3) { renderWednesday(scene); statLabel.innerText = "LEVEL"; statValue.innerText = wedState === 'setup' ? `STAGE ${wedLevel}` : `STAGE ${wedLevel}`; } 
            else if (currentDay === 4) { renderThursday(scene); statLabel.innerText = "SENSORY FOUND"; statValue.innerText = thuState === 'setup' ? "READY" : `${thuScore} / 3`; } 
            else if (currentDay === 5) { renderFriday(scene); statLabel.innerText = "PRESSURE"; statValue.innerText = Math.floor(friPopProgress) + "%"; } 
            else if (currentDay === 6) { renderSaturday(scene); statLabel.innerText = "COINS FOUND"; statValue.innerText = satState === 'setup' ? "READY" : `${satCoinsCollected} / ${satTotalCoins}`; } 
            else if (currentDay === 7) { renderSunday(scene); statLabel.innerText = "COINS CAUGHT"; statValue.innerText = sunState === 'setup' ? "READY" : sunScore; }
        }

        // --- 星期一 (Monday) ---
        function renderMonday(scene) {
            if (monState === 'setup') {
                scene.innerHTML = `<div class="glass-card p-6 flex flex-col items-center gap-4 w-80 text-center mx-auto"><div class="flex items-center justify-center h-32 w-full mb-1 bg-white rounded-xl shadow-inner overflow-hidden"><div class="relative w-[80px] h-[80px] mt-[-20px] flex items-center justify-center"><div class="w-full h-full rounded-full border-[4px] border-gray-200 relative z-10 bg-white" style="animation: demoMonRotation 2s linear infinite;"><div class="absolute w-1.5 top-[100%] left-[50%] ml-[-3px]" style="transform-origin: 50% -40px; animation: demoMonStuckAppear 2s infinite linear;"><div class="w-0 h-0 border-l-[3px] border-l-transparent border-r-[3px] border-r-transparent border-b-[8px] border-b-gray-700 mx-auto"></div><div class="w-1 h-5 bg-emerald-500 mx-auto rounded-sm"></div></div></div><div class="absolute w-1.5 top-[100%] left-[50%] ml-[-3px] z-20" style="animation: demoMonShooting 2s infinite linear;"><div class="w-1 h-5 bg-emerald-600 mx-auto rounded-sm shadow-md"></div></div></div></div><h2 class="font-black text-lg uppercase text-emerald-800 tracking-widest">Monday Pen Shot</h2><p class="text-xs font-bold text-gray-500">完成 3 個階段以獲取最高獎勵</p><div class="w-full flex flex-col gap-3"><div id="mon-upload" class="w-full h-24 rounded-xl border-2 border-dashed border-emerald-400 bg-white flex items-center justify-center cursor-pointer overflow-hidden">${monBossImg ? `<img src="${monBossImg}" class="max-w-full max-h-full object-contain">` : `<span class="text-emerald-500 font-bold text-xs uppercase">點擊上傳壓力源</span>`}</div><input type="file" id="mon-file" class="hidden" accept="image/*">${monBossImg ? `<button onclick="monLevel=1; startMonGame()" class="bg-emerald-600 text-white py-3 rounded-xl font-black text-lg animate-bounce">開始擊碎壓力</button>` : ''}</div></div>`;
                document.getElementById('mon-upload').onclick = () => document.getElementById('mon-file').click();
                document.getElementById('mon-file').onchange = (e) => { const reader = new FileReader(); reader.onload = (ev) => { monBossImg = ev.target.result; render(); }; reader.readAsDataURL(e.target.files[0]); };
            } else {
                scene.innerHTML = `<div id="mon-play-area" class="w-full h-full relative flex items-center justify-center"><div id="mon-stats" class="absolute top-4 left-4 text-sm font-black uppercase text-emerald-900 bg-white/60 px-3 py-1 rounded-full shadow-sm">🎯剩餘: <span id="mon-pens-left">${monPensLeft}</span> | ❤️ <span id="mon-lives-display">${monLives}</span></div><div class="relative w-[160px] h-[160px]" id="mon-target-wrap"><div id="mon-target-circle" class="target-circle overflow-hidden w-full h-full">${monBossImg ? `<img src="${monBossImg}" class="w-full h-full object-cover">` : ''}</div><div id="mon-stuck-layer" class="absolute inset-0 pointer-events-none"></div><div id="mon-shooter" class="shooter-pen"><div class="pen-tip"></div><div class="pen-body"></div></div></div></div>`;
                monAnimId = requestAnimationFrame(monLoop);
                document.getElementById('mon-play-area').onpointerdown = (e) => { e.preventDefault(); shootMonPen(); };
            }
        }
        function startMonGame() { 
            startCountdown(() => { 
                monState = 'playing'; 
                monPensLeft = 5 + monLevel; 
                monStuckAngles = []; 
                monLives = 3; 
                monFrameCount = 0;
                render(); 
                document.getElementById('mon-pens-left').innerText = monPensLeft;
            }); 
        }
        function monLoop() {
            if (currentDay !== 1 || monState !== 'playing') return;
            monFrameCount++;
            let speed = 1.0;
            if (monLevel === 1) {
                speed = 1.5;
            } else if (monLevel === 2) {
                // 等級 2: 使用三次方程式 (s^3) 配合不對稱振幅
                // 正轉與反轉的最高速度不同，這會導致每次煞車的停止位置都在圓周的不同角度！
                // s^3 曲線在接近 0 的時候，會提供一段非常長且明顯的「煞車與懸停」時間，讓玩家能輕鬆瞄準。
                let s = Math.sin(monFrameCount * 0.012); 
                let amp = (s > 0) ? 4.0 : 2.2; 
                speed = s * s * s * amp; 
            } else {
                // 等級 3: 稍快的週期，並加入一點動態漂移，讓每次煞車的落點更加不規則且遍佈 360 度
                let s = Math.sin(monFrameCount * 0.015);
                let drift = Math.cos(monFrameCount * 0.005);
                let amp = (s > 0) ? (5.0 + drift) : (3.0 - drift);
                speed = s * s * s * amp;
            }
            monRotation += speed; 
            const target = document.getElementById('mon-target-circle'); const layer = document.getElementById('mon-stuck-layer');
            if (target) target.style.transform = `rotate(${monRotation}deg)`; if (layer) layer.style.transform = `rotate(${monRotation}deg)`;
            monAnimId = requestAnimationFrame(monLoop);
        }
        function shootMonPen() {
            if (monIsShooting || monState !== 'playing') return;
            monIsShooting = true; const shooter = document.getElementById('mon-shooter');
            shooter.style.transition = 'margin-top 0.1s linear'; shooter.style.marginTop = '0px';
            setTimeout(() => {
                const hitAngle = (360 - (monRotation % 360)) % 360;
                const isCollision = monStuckAngles.some(a => Math.abs(a - hitAngle) < 10); 
                if (isCollision) {
                    shooter.style.transition = 'transform 0.4s, margin-top 0.4s'; shooter.style.transform = 'translateX(-50%) rotate(45deg)'; shooter.style.marginTop = '200px';
                    monLives--; document.getElementById('mon-lives-display').innerText = monLives;
                    setTimeout(() => {
                        if (monLives <= 0) {
                            const reward = monLevel * 4; 
                            showModal("挑戰結束", `你倒在了第 ${monLevel} 階段。拿走這些硬幣，下次再來！`, "領取安慰獎", () => { monState = 'setup'; monLevel = 1; render(); }, reward);

                        </div>
                        <h2 class="font-black text-lg uppercase text-emerald-800 tracking-widest">Friday Burst</h2>
                        <div id="fri-upload" class="w-full h-24 rounded-xl border-2 border-dashed border-emerald-400 bg-emerald-50 flex items-center justify-center cursor-pointer overflow-hidden relative shadow-inner">
                            ${friTargetImg ? `<img src="${friTargetImg}" class="max-w-full max-h-full object-contain">` : `<div class="text-center"><span class="text-3xl block mb-1">🎈</span><span class="text-emerald-500 font-bold text-xs uppercase">點擊上傳壓力來源</span></div>`}
                        </div>
                        <input type="file" id="fri-file" class="hidden" accept="image/*">
                        <p class="text-xs text-gray-500 font-bold">必須先封裝壓力，才能開始充氣</p>
                        ${friTargetImg ? `<button onclick="startFriGame()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-black text-lg animate-pulse shadow-lg mt-1">開始充氣</button>` : ''}
                    </div>
                `;
                document.getElementById('fri-upload').onclick = () => document.getElementById('fri-file').click();
                document.getElementById('fri-file').onchange = (e) => { const reader = new FileReader(); reader.onload = (ev) => { friTargetImg = ev.target.result; render(); }; reader.readAsDataURL(e.target.files[0]); };
            } else {
                scene.innerHTML = `
                    <div class="flex flex-col items-center gap-10 touch-none w-full">
                        <div id="fri-balloon-wrap" class="w-40 h-40 relative transition-transform duration-75 cursor-pointer mt-10">
                            <!-- 改為純正的 rounded-full 實現正圓氣球 -->
                            <div id="fri-balloon" class="w-full h-full rounded-full bg-emerald-400 flex items-center justify-center overflow-hidden shadow-inner border-[6px] border-emerald-300">
                                ${friTargetImg ? `<img src="${friTargetImg}" class="w-full h-full object-cover mix-blend-multiply opacity-80">` : ''}
                            </div>
                            <div id="fri-knot" class="balloon-knot"></div>
                        </div>
                        <div class="w-64 h-4 bg-white rounded-full overflow-hidden border-2 border-emerald-200 mt-4">
                            <div id="fri-bar" class="h-full bg-emerald-500 transition-all duration-75" style="width: 0%"></div>
                        </div>
                        <p class="text-sm font-black text-emerald-800 uppercase animate-bounce">狂點螢幕充爆它！</p>
                        <button id="fri-pump-btn" class="w-64 py-6 bg-emerald-600 text-white font-black rounded-2xl shadow-xl active:scale-95">充氣！</button>
                    </div>
                `;
            
                const pump = (e) => {
                    e.preventDefault(); if (friIsExploded) return;
                    // 大幅增加點擊的充氣量 (15 -> 25)
                    friPopProgress = Math.min(100, friPopProgress + 25); 
                    if (navigator.vibrate) navigator.vibrate(15);
                };
                document.getElementById('fri-pump-btn').onpointerdown = pump;
                document.getElementById('fri-balloon-wrap').onpointerdown = pump;
                friLoop();
            }
        }
        function startFriGame() { startCountdown(() => { friState = 'playing'; friPopProgress = 0; friIsExploded = false; render(); }); }
        function friLoop() {
            if (currentDay !== 5 || friState !== 'playing') return;
            if (friPopProgress > 0 && !friIsExploded) {
                // 大幅減緩漏氣速度 (0.15 -> 0.05)
                friPopProgress -= 0.05; 
                const balloon = document.getElementById('fri-balloon-wrap');
                const balloonInner = document.getElementById('fri-balloon');
                const knot = document.getElementById('fri-knot');
                const bar = document.getElementById('fri-bar');
                if (balloon && bar) {
                    const scale = 1 + (friPopProgress / 100) * 1.8;
                    balloon.style.transform = `scale(${scale})`;
                    bar.style.width = friPopProgress + '%';
                    
                    if(friPopProgress > 80) { balloonInner.style.backgroundColor = '#EF4444'; balloonInner.style.borderColor = '#FCA5A5'; knot.style.borderBottomColor = '#EF4444'; }
                    else { balloonInner.style.backgroundColor = '#34D399'; balloonInner.style.borderColor = '#6EE7B7'; knot.style.borderBottomColor = '#34D399'; }

                    if (friPopProgress >= 100) {
                        friIsExploded = true;
                        balloon.style.display = 'none'; 
                        if(navigator.vibrate) navigator.vibrate([100,50,100]);
                        showModal("BOOM! 🎉", "壓力徹底炸裂！週末愉快！", "領取獎勵", () => { friState='setup'; render(); }, 18);
                    }
                }
            }
            document.getElementById('stat-value').innerText = Math.floor(friPopProgress) + "%";
            friAnimId = requestAnimationFrame(friLoop);
        }

        // --- 星期六 (Saturday) ---
        function renderSaturday(scene) {
            if (satState === 'setup') {
                scene.innerHTML = `
                    <div class="glass-card p-8 flex flex-col items-center gap-6 w-80 text-center mx-auto">
                        <div class="flex items-center justify-center h-32 w-full relative bg-gray-300 rounded-xl shadow-inner overflow-hidden border border-gray-400">
                            <div class="absolute w-16 h-16 z-0 flex items-center justify-center"><img src="${LIFE_COIN_SRC}" onerror="this.src='${fallbackCoinSrc}'" class="w-full h-full object-contain drop-shadow-md"></div>
                            <div class="absolute inset-0 bg-gray-400 z-10 opacity-90" style="animation: demoSatCloud 3s infinite;"></div>
                            <div class="absolute text-4xl z-20" style="animation: demoSatSwipe 3s infinite;">👆</div>
                        </div>
                        <h2 class="font-black text-lg uppercase text-emerald-800 tracking-widest">Saturday Cloud</h2>
                        <p class="text-sm font-bold text-gray-600 leading-relaxed">輕拂螢幕吹散雲霧，<br>尋找隱藏的週末 Life Coins！</p>
                        <button onclick="startSatGame()" class="w-full bg-emerald-600 text-white py-4 rounded-xl font-black text-xl shadow-lg mt-2">開始尋寶</button>
                    </div>
                `;
            } else {
                scene.innerHTML = `
                    <div class="w-full h-full relative overflow-hidden bg-emerald-50 touch-none rounded-xl border-2 border-gray-200">
                        <div id="sat-coins-layer" class="absolute inset-0 z-0 bg-gradient-to-b from-blue-200 to-emerald-100"></div>
                        <canvas id="sat-canvas" class="absolute inset-0 w-full h-full z-10 cursor-crosshair mix-blend-normal"></canvas>
                    </div>
                `;
                initSatGame(scene);
            }
        }

        function startSatGame() {
            startCountdown(() => {
                satState = 'playing'; satCoinsCollected = 0; satLastPos = null;
                satTotalCoins = Math.floor(Math.random() * 6) + 5; 
                satCoins = []; satWindParticles = []; render();
            });
        }

        function initSatGame(scene) {
            satCanvas = document.getElementById('sat-canvas'); satCtx = satCanvas.getContext('2d');
            const container = satCanvas.parentElement; satCanvas.width = container.clientWidth; satCanvas.height = container.clientHeight;

            satCtx.fillStyle = '#6b7280'; satCtx.fillRect(0, 0, satCanvas.width, satCanvas.height);
            for(let i=0; i<50; i++) {
                satCtx.beginPath(); satCtx.arc(Math.random() * satCanvas.width, Math.random() * satCanvas.height, Math.random() * 80 + 40, 0, Math.PI * 2);
                satCtx.fillStyle = `rgba(156, 163, 175, ${Math.random() * 0.5 + 0.5})`; satCtx.fill();
            }
            satCanvas.style.filter = "blur(10px) contrast(1.1)"; 

            const layer = document.getElementById('sat-coins-layer');
            for(let i=0; i<satTotalCoins; i++) {
                const x = 40 + Math.random() * (satCanvas.width - 80); const y = 40 + Math.random() * (satCanvas.height - 80);
                const coinContainer = document.createElement('div');
                coinContainer.className = 'absolute w-16 h-16 transition-all duration-500 transform scale-50 opacity-0 drop-shadow-xl flex items-center justify-center pointer-events-none';
                coinContainer.style.left = `${x - 32}px`; coinContainer.style.top = `${y - 32}px`;
                const coin = document.createElement('img');
                coin.onerror = () => { coin.src = fallbackCoinSrc; };
                coin.src = LIFE_COIN_SRC;
                coin.className = 'w-full h-full object-contain';
                coinContainer.appendChild(coin);
                layer.appendChild(coinContainer);
                satCoins.push({ x, y, revealed: false, el: coinContainer });
            }

            satCanvas.onpointerdown = (e) => { satIsSwiping = true; const rect = satCanvas.getBoundingClientRect(); satLastPos = {x: e.clientX-rect.left, y: e.clientY-rect.top}; satCanvas.setPointerCapture(e.pointerId); eraseCloud(e); };
            satCanvas.onpointermove = (e) => { if (satIsSwiping) eraseCloud(e); };
            satCanvas.onpointerup = () => { satIsSwiping = false; satLastPos = null; };
            satLoop();
        }

        function eraseCloud(e) {
            const rect = satCanvas.getBoundingClientRect(); const x = e.clientX - rect.left; const y = e.clientY - rect.top;
            
            if (satLastPos) {
                const dx = x - satLastPos.x; const dy = y - satLastPos.y;
                const speed = Math.hypot(dx, dy);
                if (speed > 5) {
                    for(let i=0; i<4; i++) {
                        satWindParticles.push({
                            x: x + (Math.random()-0.5)*30, y: y + (Math.random()-0.5)*30,
                            vx: dx * 0.15 + (Math.random()-0.5)*2, vy: dy * 0.15 + (Math.random()-0.5)*2,
                            life: 1.0, size: Math.random() * 30 + 30
                        });
                    }
                }
            }
            satLastPos = {x, y};
            
            satCtx.globalCompositeOperation = 'destination-out';
            const radius = 70;
            const grad = satCtx.createRadialGradient(x, y, 0, x, y, radius);
            grad.addColorStop(0, 'rgba(0,0,0,1)'); grad.addColorStop(0.5, 'rgba(0,0,0,0.8)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
            satCtx.beginPath(); satCtx.arc(x, y, radius, 0, Math.PI * 2); satCtx.fillStyle = grad; satCtx.fill();
            satCtx.globalCompositeOperation = 'source-over';

            satCoins.forEach(c => {
                if (!c.revealed && Math.hypot(c.x - x, c.y - y) < radius - 20) {
                    c.revealed = true;
                    c.el.classList.remove('scale-50', 'opacity-0'); c.el.classList.add('scale-100', 'opacity-100', 'animate-bounce');
                    satCoinsCollected++;
                    document.getElementById('stat-value').innerText = `${satCoinsCollected} / ${satTotalCoins}`;
                    if(navigator.vibrate) navigator.vibrate(20);
                    
                    if (satCoinsCollected >= satTotalCoins) {
                        setTimeout(() => {
                            showModal("大豐收！🎉", `你撥開雲霧，找到了全部 ${satTotalCoins} 枚金幣！`, "收入口袋", () => { satState = 'setup'; render(); }, satTotalCoins);
                        }, 1000);
                    }
                }
            });
        }
        
        function satLoop() {
            if(currentDay !== 6 || satState !== 'playing') return;
            satCtx.globalCompositeOperation = 'source-over';
            for(let i=satWindParticles.length-1; i>=0; i--) {
                let p = satWindParticles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.05; p.size += 1;
                if(p.life <= 0) { satWindParticles.splice(i, 1); continue; }
                satCtx.beginPath(); satCtx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                satCtx.fillStyle = `rgba(229, 231, 235, ${p.life * 0.2})`; 
                satCtx.fill();
            }
            requestAnimationFrame(satLoop);
        }

        // --- 星期日 (Sunday) ---
        function renderSunday(scene) {
            if (sunState === 'setup') {
                scene.innerHTML = `
                    <div class="glass-card p-8 flex flex-col items-center gap-4 w-80 text-center mx-auto">
                        <div class="h-32 w-full relative bg-blue-50 rounded-xl overflow-hidden border-2 border-gray-200">
                            <div class="absolute w-12 h-12 flex items-center justify-center" style="animation: demoSunCoin 3s infinite linear;">
                                <img src="${LIFE_COIN_SRC}" onerror="this.src='${fallbackCoinSrc}'" class="w-full h-full object-contain">
                            </div>
                            <div class="absolute bottom-2 w-16 h-8 bg-orange-400 rounded-b-xl rounded-t-sm" style="animation: demoSunBasket 3s infinite ease-in-out;"></div>
                        </div>
                        <h2 class="font-black text-lg uppercase text-emerald-800 tracking-widest">Sunday Slumber</h2>
                        <p class="text-sm font-bold text-gray-600 leading-relaxed">最低難度，極致放鬆。<br>慢慢滑動籃子接住 Life Coins。</p>
                        <button onclick="startSunGame()" class="w-full bg-emerald-600 text-white py-4 rounded-xl font-black text-xl shadow-lg mt-2">開始收集</button>
                    </div>
                `;
            } else {
                 scene.innerHTML = `
                    <canvas id="sun-canvas" class="w-full h-full absolute inset-0 z-20 touch-none rounded-xl bg-gradient-to-b from-blue-100 to-indigo-50"></canvas>
                    <div id="sun-lives" class="absolute top-4 right-4 text-2xl z-30 tracking-widest drop-shadow-md">❤️❤️❤️</div>
                 `;
                 sunCanvas = document.getElementById('sun-canvas'); sunCtx = sunCanvas.getContext('2d');
                 sunCanvas.width = scene.clientWidth; sunCanvas.height = scene.clientHeight;
                 sunBasketX = sunCanvas.width / 2;
                 
                 sunCanvas.onpointermove = (e) => { const rect = sunCanvas.getBoundingClientRect(); sunBasketX = e.clientX - rect.left; };
                 sunCanvas.ontouchmove = (e) => { e.preventDefault(); const rect = sunCanvas.getBoundingClientRect(); sunBasketX = e.touches[0].clientX - rect.left; };
                 
                 const coinImg = new Image();
                 coinImg.onload = () => { sunState = 'playing'; sunLoop(coinImg); };
                 coinImg.onerror = () => { 
                     if (coinImg.src !== fallbackCoinSrc) {
                         coinImg.src = fallbackCoinSrc; 
                     } else {
                         sunState = 'playing'; sunLoop(coinImg);
                     }
                 };
                 coinImg.src = LIFE_COIN_SRC;
            }
        }
        function startSunGame() { startCountdown(() => { sunScore = 0; sunLives = 3; sunCoins = []; sunFrameCount = 0; render(); }); }
        
        function sunLoop(coinImg) {
            if(currentDay !== 7 || sunState !== 'playing') return;
            sunFrameCount++;
            
            const spawnRate = Math.max(50, 180 - Math.floor(sunScore / 2) * 8);
            if(sunFrameCount % spawnRate === 0) {
                sunCoins.push({
                    x: 30 + Math.random() * (sunCanvas.width - 60),
                    y: -30,
                    vy: 1.5 + (sunScore * 0.05), 
                    rot: 0
                });
            }
            
            sunCtx.clearRect(0, 0, sunCanvas.width, sunCanvas.height);
            
            const bw = 80, bh = 40;
            const bx = Math.max(0, Math.min(sunCanvas.width - bw, sunBasketX - bw/2));
            const by = sunCanvas.height - 60;
            
            sunCtx.fillStyle = '#fb923c';
            sunCtx.beginPath(); sunCtx.roundRect(bx, by, bw, bh, [5, 5, 20, 20]); sunCtx.fill();
            sunCtx.strokeStyle = '#ea580c'; sunCtx.lineWidth = 4; sunCtx.stroke();
            
            for(let i = sunCoins.length - 1; i >= 0; i--) {
                let c = sunCoins[i]; c.y += c.vy; c.rot += 0.02;
                
                sunCtx.save(); sunCtx.translate(c.x, c.y); sunCtx.rotate(c.rot);
                if (coinImg.complete && coinImg.naturalWidth !== 0) {
                    sunCtx.drawImage(coinImg, -30, -30, 60, 60); 
                }
                sunCtx.restore();
                
                if(c.y + 20 > by && c.y - 20 < by + bh && c.x > bx - 20 && c.x < bx + bw + 20) {
                    sunScore++; sunCoins.splice(i, 1);
                    if(navigator.vibrate) navigator.vibrate(10);
                    document.getElementById('stat-value').innerText = sunScore;
                    continue;
                }
                
                if(c.y > sunCanvas.height + 30) {
                    sunCoins.splice(i, 1); sunLives--;
                    document.getElementById('sun-lives').innerText = '❤️'.repeat(sunLives);
                    if(navigator.vibrate) navigator.vibrate([30, 30]);
                    if(sunLives <= 0) {
                        sunState = 'gameover'; 
                        const reward = Math.min(20, Math.max(8, Math.floor(sunScore / 2)));
                        showModal("睡覺時間", `收集了 ${sunScore} 枚硬幣，準備好迎接新的一週了！`, "領取獎勵", () => { sunState = 'setup'; render(); }, reward);
                    }
                }
            }
            sunAnimId = requestAnimationFrame(() => sunLoop(coinImg));
        }

        // --- 全域彈窗與獎勵結算 ---
        function showModal(title, content, btnText, callback, rewardCoins = 0) {
            const modal = document.getElementById('game-modal');
            const rewardDiv = document.getElementById('modal-reward');
            const btn = document.getElementById('modal-btn');
            
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-content').innerHTML = content;
            
            if (rewardCoins > 0) {
                rewardDiv.style.display = 'flex';
                document.getElementById('modal-coin-amount').innerText = `+${rewardCoins}`;
                btn.onclick = () => {
                    const rect = btn.getBoundingClientRect();
                    animateCoinsToWallet(rewardCoins, rect);
                    addLifeCoins(rewardCoins);
                    modal.style.display = 'none';
                    callback();
                };
            } else {
                rewardDiv.style.display = 'none';
                btn.onclick = () => { modal.style.display = 'none'; callback(); };
            }
            
            btn.innerText = btnText;
            modal.style.display = 'flex';
        }

        window.onload = () => switchDay(1);
    </script>
</body>
</html>
