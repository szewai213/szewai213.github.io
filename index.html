<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GapSense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --mint-primary: #10B981;
            --mint-dark: #064E3B;
            --mint-bg: #DCFCE7;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--mint-bg);
            color: var(--mint-dark);
            margin: 0; padding: 0;
            overflow: hidden;
            height: 100dvh; 
            width: 100vw;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
        }
        .nav-btn {
            transition: all 0.2s;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-btn.active {
            background: var(--mint-dark);
            color: white;
            transform: scale(1.05);
        }
        .game-canvas {
            width: 100%; 
            flex: 1;
            min-height: 0; 
            position: relative;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            background: var(--mint-bg);
        }

        /* Animations */
        @keyframes demoMonRotation { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes demoMonShooting { 0%, 15% { margin-top: 40px; opacity: 1; } 25% { margin-top: 0px; opacity: 1; } 25.1%, 100% { margin-top: 0px; opacity: 0; } }
        @keyframes demoMonStuckAppear { 0%, 24.9% { opacity: 0; transform: rotate(0deg); } 25%, 90% { opacity: 1; transform: rotate(-90deg); } 90.1%, 100% { opacity: 0; transform: rotate(-90deg); } }
        @keyframes demoTueLaser { 0% { width: 0; left: -10%; top: 50%; opacity: 0; } 10% { width: 0; left: -10%; top: 50%; opacity: 1; } 45% { width: 120%; left: 110%; top: 20%; opacity: 1; box-shadow: 0 0 20px #10B981, 0 0 10px white; } 55%, 100% { width: 120%; left: 110%; top: 20%; opacity: 0; } }
        @keyframes demoThuCamera { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); box-shadow: 0 0 20px #10B981; } }
        @keyframes demoSatSwipe { 0%, 20% { transform: translate(-50px, 0); opacity: 0; } 30% { transform: translate(-50px, 0); opacity: 1; } 70% { transform: translate(50px, 0); opacity: 1; } 80%, 100% { transform: translate(50px, 0); opacity: 0; } }
        @keyframes demoSatCloud { 0%, 40% { opacity: 1; filter: blur(2px); } 60%, 80% { opacity: 0; filter: blur(8px); } 90%, 100% { opacity: 1; filter: blur(2px); } }
        @keyframes demoSunCoin { 0% { top: -10%; left: 50%; opacity: 1; transform: translateX(-50%) rotate(0deg); } 100% { top: 90%; left: 50%; opacity: 0; transform: translateX(-50%) rotate(180deg); } }
        @keyframes demoSunBasket { 0%, 100% { left: 30%; } 50% { left: 50%; } }
        @keyframes countDownPop { 0% { transform: scale(0.3); opacity: 0; } 20% { transform: scale(1.1); opacity: 1; } 70% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
        @keyframes flyCoin { 0% { transform: scale(1) translate(0, 0); opacity: 1; } 100% { transform: scale(0.5) translate(var(--tx), var(--ty)); opacity: 0; } }
        @keyframes demoFriPumpSlow { 0% { transform: scale(0.6); } 25% { transform: scale(1.2); } 50% { transform: scale(1.8); } 75% { transform: scale(2.5); opacity: 1; } 85%, 100% { transform: scale(0); opacity: 0; } }
        @keyframes demoFriClickSlow { 0%, 25%, 50%, 75% { transform: translate(0,0) scale(1); } 12%, 37%, 62%, 80% { transform: translate(-10px, -10px) scale(0.8); } 85%, 100% { opacity: 0; } }
        @keyframes monHitElastic { 0% { transform: scale(1); } 40% { transform: scale(0.92); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
        @keyframes shatterCoin { 0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0.5) rotate(var(--rot)); opacity: 0; } }
        .mon-hit-anim { animation: monHitElastic 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94); }

        @keyframes satTwinkle { 0%, 100% { opacity: 0.1; transform: scale(0.5) rotate(0deg); filter: blur(1px); } 50% { opacity: 0.9; transform: scale(1.5) rotate(45deg); filter: blur(0px); } }
        .sat-sparkle { position: absolute; width: 24px; height: 24px; margin-left: -12px; margin-top: -12px; pointer-events: none; z-index: 15; mix-blend-mode: screen; }
        .sat-sparkle::before, .sat-sparkle::after { content: ''; position: absolute; background: white; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; box-shadow: 0 0 8px 2px rgba(255,255,255,0.8); }
        .sat-sparkle::before { width: 100%; height: 2px; } .sat-sparkle::after { width: 2px; height: 100%; }
        .sat-sparkle-anim { animation: satTwinkle 2s infinite ease-in-out; }
        
        @keyframes satPanicJump {
            0%   { transform: scale(0.5) translate(0, 0); opacity: 1; filter: drop-shadow(0 0 10px red); }
            10%  { transform: scale(1.5) translate(0, -30px); opacity: 1; filter: drop-shadow(0 0 20px red); }
            20%  { transform: scale(1.5) translate(0, -30px) rotate(-15deg); opacity: 1; filter: drop-shadow(0 0 20px red); }
            30%  { transform: scale(1.5) translate(0, -30px) rotate(15deg); opacity: 1; filter: drop-shadow(0 0 20px red); }
            40%  { transform: scale(1.5) translate(0, -30px) rotate(-15deg); opacity: 1; filter: drop-shadow(0 0 20px red); }
            50%  { transform: scale(1.5) translate(0, -30px) rotate(15deg); opacity: 1; filter: drop-shadow(0 0 20px red); }
            60%  { transform: scale(1.5) translate(0, -30px) rotate(0deg); opacity: 1; filter: drop-shadow(0 0 20px red); }
            100% { transform: scale(0.5) translate(var(--run-tx), var(--run-ty)); opacity: 0; filter: drop-shadow(0 0 0px red); }
        }
        .sat-panic { animation: satPanicJump 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards !important; will-change: transform, filter, opacity; }

        /* Component Styles */
        .target-circle { width: 160px; height: 160px; border-radius: 50%; background: #e5e7eb; border: 6px solid #9ca3af; position: relative; z-index: 10; }
        .pen-stuck { position: absolute; width: 8px; top: 100%; left: 50%; margin-left: -4px; transform-origin: 50% -80px; z-index: 20; }
        .shooter-pen { position: absolute; width: 8px; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 100px; z-index: 30; }
        .pen-body { width: 6px; height: 45px; background: #10B981; margin: 0 auto; border-radius: 2px; }
        .pen-tip { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 12px solid #374151; margin: 0 auto; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .tabular-nums { font-variant-numeric: tabular-nums; }
        .balloon-knot { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 16px solid #34D399; z-index: -1; }
        .flying-coin { position: fixed; width: 40px; height: 40px; z-index: 9999; pointer-events: none; animation: flyCoin 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; object-fit: contain; will-change: transform, opacity; }
    </style>
</head>
<body class="flex flex-col">

    <!-- 心情分析選擇器 (Mood Screen) -->
    <div id="mood-screen" class="fixed inset-0 bg-[#DCFCE7] z-[3000] flex flex-col items-center justify-center transition-opacity duration-500">
        <h2 class="text-2xl md:text-3xl font-black text-emerald-900 mb-8 tracking-wide">Pick a color.</h2>
        <div class="flex flex-wrap justify-center gap-6 max-w-[280px]">
            <!-- 紅色: 煩躁/不耐煩 -> 對應 W 星期三 (訓練平靜與耐性) -->
            <button onclick="pickMood(3)" class="w-16 h-16 rounded-full bg-[#EF4444] shadow-md border-4 border-white/60 active:scale-90 transition-transform"></button>
            <!-- 深灰: 壓抑/卡關 -> 對應 M 星期一 (射擊釋放壓力) -->
            <button onclick="pickMood(1)" class="w-16 h-16 rounded-full bg-[#334155] shadow-md border-4 border-white/60 active:scale-90 transition-transform"></button>
            <!-- 橘色: 混亂/焦慮 -> 對應 T 星期二 (切除雜亂郵件理清思緒) -->
            <button onclick="pickMood(2)" class="w-16 h-16 rounded-full bg-[#F97316] shadow-md border-4 border-white/60 active:scale-90 transition-transform"></button>
            <!-- 灰藍: 麻木/抽離 -> 對應 T 星期四 (尋找真實綠色重啟感官) -->
            <button onclick="pickMood(4)" class="w-16 h-16 rounded-full bg-[#94A3B8] shadow-md border-4 border-white/60 active:scale-90 transition-transform"></button>
            <!-- 深紫: 緊繃/快爆發 -> 對應 F 星期五 (打氣引爆釋放) -->
            <button onclick="pickMood(5)" class="w-16 h-16 rounded-full bg-[#8B5CF6] shadow-md border-4 border-white/60 active:scale-90 transition-transform"></button>
            <!-- 亮粉: 急躁/靜不下來 -> 對應 S 星期六 (強迫慢速擦拭) -->
            <button onclick="pickMood(6)" class="w-16 h-16 rounded-full bg-[#EC4899] shadow-md border-4 border-white/60 active:scale-90 transition-transform"></button>
            <!-- 泥褐: 疲憊/耗盡 -> 對應 S 星期日 (極低難度放空收集) -->
            <button onclick="pickMood(7)" class="w-16 h-16 rounded-full bg-[#78350F] shadow-md border-4 border-white/60 active:scale-90 transition-transform"></button>
        </div>
        <!-- 略過選擇按鈕 -->
        <button onclick="pickMood(1)" class="mt-12 text-sm font-semibold text-emerald-700/50 hover:text-emerald-800 transition-colors tracking-widest uppercase">Skip for now</button>
    </div>

    <header class="p-3 shrink-0 text-center relative z-50">
        <h1 class="text-2xl font-black tracking-tight uppercase">GapSense</h1>
        <p class="text-[11px] font-bold text-emerald-600 uppercase tracking-widest italic mb-2 mt-0.5">Weekly De-stress</p>
        
        <div class="absolute top-2 right-2 bg-white/90 px-3 py-1 rounded-full font-black text-emerald-800 flex items-center gap-2 shadow-sm border border-emerald-100 z-50 scale-90 origin-top-right" id="wallet-ui">
            <div class="w-6 h-6 flex items-center justify-center"><img src="" id="wallet-coin-icon" class="w-full h-full object-contain drop-shadow-sm"></div>
            <span id="global-coins" class="text-base">0</span>
        </div>

        <div class="flex justify-between gap-1.5 overflow-x-auto no-scrollbar max-w-sm mx-auto px-2">
            <div onclick="switchDay(1)" id="btn-1" class="nav-btn flex-1 py-2 glass-card font-black text-sm">M</div>
            <div onclick="switchDay(2)" id="btn-2" class="nav-btn flex-1 py-2 glass-card font-black text-sm">T</div>
            <div onclick="switchDay(3)" id="btn-3" class="nav-btn flex-1 py-2 glass-card font-black text-sm">W</div>
            <div onclick="switchDay(4)" id="btn-4" class="nav-btn flex-1 py-2 glass-card font-black text-sm">T</div>
            <div onclick="switchDay(5)" id="btn-5" class="nav-btn flex-1 py-2 glass-card font-black text-sm">F</div>
            <div onclick="switchDay(6)" id="btn-6" class="nav-btn flex-1 py-2 glass-card font-black text-sm">S</div>
            <div onclick="switchDay(7)" id="btn-7" class="nav-btn flex-1 py-2 glass-card font-black text-sm">S</div>
        </div>
    </header>

    <main id="game-container" class="flex-1 flex flex-col items-center justify-between py-2 relative min-h-0 w-full">
        <div id="game-scene" class="game-canvas"></div>
        <div class="w-full max-w-xs px-4 mt-2 mb-3 z-40 shrink-0">
            <div class="glass-card p-3 flex justify-between items-center shadow-sm">
                <div id="status-box">
                    <p id="stat-label" class="text-xs text-emerald-700 font-black uppercase italic tracking-widest">STATUS</p>
                    <p id="stat-value" class="text-xl font-black text-emerald-950 mt-0.5">Ready</p>
                </div>
            </div>
        </div>
    </main>

    <div id="countdown-overlay" class="fixed inset-0 bg-emerald-950/80 z-[2000] hidden flex-col items-center justify-center backdrop-blur-md">
        <div id="countdown-text" class="text-white text-[30vw] md:text-[10rem] font-black italic tracking-tighter"></div>
    </div>

    <div id="game-modal" class="modal-overlay">
        <div class="glass-card bg-white p-6 max-w-xs w-full text-center shadow-2xl relative overflow-hidden">
            <h3 id="modal-title" class="font-black text-xl mb-2 text-emerald-900 relative z-10">Done!</h3>
            <div id="modal-content" class="mb-4 text-base font-semibold text-gray-600 leading-relaxed relative z-10"></div>
            <div id="modal-reward" class="hidden flex-col items-center justify-center mb-4 py-3 bg-emerald-50 rounded-xl border border-emerald-200 shadow-inner relative z-10">
                <p class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest mb-1">REWARD</p>
                <div class="flex items-center gap-2 text-3xl font-black text-emerald-700">
                    <div class="w-12 h-12 flex items-center justify-center"><img src="" id="modal-coin-icon" class="w-full h-full object-contain drop-shadow-md"></div> <span id="modal-coin-amount">+0</span>
                </div>
            </div>
            <button id="modal-btn" class="w-full py-3 bg-emerald-600 text-white rounded-xl font-black text-lg active:scale-95 transition-transform relative z-10">Next</button>
        </div>
    </div>

    <script>
        const apiKey = ""; 
        let currentDay = 1;
        let countdownTimer = null;

        // Vibrate helper (Safe & Optimized for mobile)
        function vibe(pattern) {
            try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e) {}
        }
        
        // --- Fallback SVG ---
        const fallbackCoinSvg = `<svg id="圖層_1" data-name="圖層 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 59.53 59.53"><defs><style>.cls-1{fill:#94a865;}</style></defs><path class="cls-1" d="M29.78,4a25.76,25.76,0,1,0,9.86,2A25.79,25.79,0,0,0,29.78,4Zm2,10.58c.6.12,1.19.26,1.78.44V26H44.72a14.25,14.25,0,0,1,.39,2,15,15,0,0,1,.13,1.76H29.81V14.33A17.38,17.38,0,0,1,31.83,14.57Zm17.36,24.8-.42.81c-.11.18-.21.37-.33.57l-.18.3c-.06.1-.13.2-.19.31l-.41.61a22.32,22.32,0,0,1-1.81,2.3l-.27.28-.26.28-.28.28a5.78,5.78,0,0,1-.62.56c-.1.09-.19.19-.3.28l-.32.28-.66.54-.12.09a8.07,8.07,0,0,1-.89.62A22.29,22.29,0,0,1,31,51.34H29.21a6.84,6.84,0,0,1-1-.05H28a1.29,1.29,0,0,1-.39,0l-.5,0-.3,0-.3,0-.26,0c-.4-.06-.78-.14-1.15-.22l-.46-.1-.23-.06-.62-.16-.35-.11L23,50.27c-.38-.12-.72-.25-1-.37l-.18-.07-.34-.14-.29-.13-.35-.15q-.6-.27-1.44-.72A23.92,23.92,0,0,1,15.53,46l-.44-.4-.55-.52L14.41,45,14,44.58l-.3-.33c-.11-.11-.21-.23-.31-.35s-.23-.25-.34-.38l-.32-.41c-.11-.13-.21-.27-.32-.41-.42-.56-.81-1.14-1.17-1.73-.06-.09-.11-.18-.16-.27-.22-.36-.44-.76-.66-1.18-.06-.15-.14-.29-.21-.43s-.15-.31-.22-.48a.11.11,0,0,0,0-.09c-.05,0-.08-.2-.12-.29l-.07-.16c0-.11-.09-.23-.13-.34s-.21-.54-.33-.85a1,1,0,0,0-.06-.22.49.49,0,0,0-.05-.16A2.84,2.84,0,0,1,9,36c0-.18-.1-.31-.14-.46v-.08c-.09-.34-.18-.71-.26-1.09a.06.06,0,0,1,0-.06c-.08-.33-.15-.68-.2-1s-.09-.62-.13-.92-.06-.46-.08-.69v-.31q-.06-.82-.06-1.71a21.69,21.69,0,0,1,1-6.64,21.11,21.11,0,0,1,3.56-6.58l.26-.32c.26-.31.52-.62.76-.87l.19-.21a24.06,24.06,0,0,1,2.53-2.31c.49-.37,1-.71,1.42-1l.28-.18.62-.39.43-.25.49-.27.24-.12.47-.23.21-.1L20.9,10l.49-.21v7A15.48,15.48,0,0,0,19,18.7l-.21.21c-.13.13-.27.27-.4.42l-.28.32a15.24,15.24,0,0,0-3.64,8.27v1.36a.06.06,0,0,0,0,.06v1.95a3.5,3.5,0,0,0,0,.41l.05.41.15.81a2.07,2.07,0,0,0,.09.4,15.82,15.82,0,0,0,.9,2.67l.17.36.36.71c.13.23.26.46.4.69A17,17,0,0,0,18.31,40a14.94,14.94,0,0,0,2.15,2l.17.14.21.15.2.15.31.2.09.06.32.21.66.38.25.13c.51.27,1,.5,1.52.7l.26.09.2.07.76.25.72.2.32.07.51.11.26,0L28,45h.45c.58.05,1.05.07,1.4.07h1.88c.25,0,.51-.08.79-.13a15,15,0,0,0,2.79-.76l.33-.13.54-.23.46-.22.22-.11a2.62,2.62,0,0,0,.33-.17l.31-.17.3-.18c.23-.12.45-.27.67-.41l.37-.26c.36-.26.69-.52,1-.79l.22-.19A15.87,15.87,0,0,0,41.38,40l.21-.25c.34-.4.62-.78.85-1.1h7.13a1,1,0,0,1,0,.1C49.42,38.89,49.31,39.13,49.19,39.37Z"/></svg>`;
        const fallbackCoinSrc = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(fallbackCoinSvg);
        
        function setCoinImage(imgEl) {
            let attempt = 0;
            const sources = [ encodeURI('Lifecoins.svg'), encodeURI('Lifecoins.png'), encodeURI('工作區域 1.svg'), encodeURI('工作區域 1.png'), fallbackCoinSrc ];
            imgEl.onerror = () => { attempt++; if (attempt < sources.length) imgEl.src = sources[attempt]; };
            imgEl.src = sources[0];
        }

        const walletCoinIcon = document.getElementById('wallet-coin-icon');
        if (walletCoinIcon) setCoinImage(walletCoinIcon);
        
        const modalCoinIcon = document.getElementById('modal-coin-icon');
        if (modalCoinIcon) setCoinImage(modalCoinIcon);
        
        let totalLifeCoins = parseInt(localStorage.getItem('gapSense_lifeCoins')) || 0;
        const globalCoinsEl = document.getElementById('global-coins');
        if (globalCoinsEl) globalCoinsEl.innerText = totalLifeCoins;

        function addLifeCoins(amount) {
            totalLifeCoins += amount;
            localStorage.setItem('gapSense_lifeCoins', totalLifeCoins);
            const coinsEl = document.getElementById('global-coins');
            if (coinsEl) coinsEl.innerText = totalLifeCoins;
        }

        function animateCoinsToWallet(amount, startRect) {
            const walletUi = document.getElementById('wallet-ui');
            if (!walletUi) return;
            const walletRect = walletUi.getBoundingClientRect();
            for(let i=0; i<Math.min(amount, 10); i++) {
                setTimeout(() => {
                    const coin = document.createElement('img');
                    setCoinImage(coin);
                    coin.className = 'flying-coin';
                    coin.style.left = `${startRect.left + startRect.width/2 - 20}px`;
                    coin.style.top = `${startRect.top + startRect.height/2 - 20}px`;
                    const tx = walletRect.left + 10 - (startRect.left + startRect.width/2 - 20);
                    const ty = walletRect.top + 10 - (startRect.top + startRect.height/2 - 20);
                    coin.style.setProperty('--tx', `${tx}px`);
                    coin.style.setProperty('--ty', `${ty}px`);
                    document.body.appendChild(coin);
                    setTimeout(() => coin.remove(), 800);
                }, i * 60);
            }
        }

        async function callGemini(prompt, system = "You are a helpful assistant.", base64Image = null) {
            try {
                let parts = [{ text: prompt }];
                if (base64Image) {
                    const mimeType = base64Image.substring(5, base64Image.indexOf(';'));
                    const data = base64Image.split(',')[1];
                    parts.push({ inlineData: { mimeType: mimeType, data: data } });
                }
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ role: "user", parts: parts }], systemInstruction: { parts: [{ text: system }] } })
                });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "YES";
            } catch (error) { return "YES"; }
        }

        // States
        let monState = 'setup', monLevel = 1, monPensLeft = 0, monLives = 3, monRotation = 0, monStuckAngles = [], monBossImg = null, monIsShooting = false, monAnimId = null, monFrameCount = 0;
        let tueAnimId = null, tueCanvas, tueCtx, tueState = 'setup', tueLevel = 1, tueDurations = [25, 40, 65], tueStartTime = 0, tueTimeLeft = 0, tueCombo = 0, tueMaxCombo = 0, tueLives = 3, tueEnvelopes = [], tueParticles = [], tueTrail = [], tueIsSwiping = false;
        let wedAnimId = null, wedState = 'setup', wedLevel = 1, wedTargets = [5, 7, 15], wedStartTime = 0, wedIsPressing = false;
        let thuState = 'setup', thuScore = 0;
        let friState = 'setup', friPopProgress = 0, friIsExploded = false, friTargetImg = null, friAnimId = null, friImgX = 0, friImgY = 0, friImgScale = 1;

                    if (satCoinsCollected >= satTotalCoins) { setTimeout(() => { if (currentDay === 6) showModal("Relaxed!", `Found all ${satTotalCoins} coins!`, "Claim", () => { satState = 'setup'; render(); }, satTotalCoins); }, 1000); }
                }
            });
        }
        function handleSatPenalty() {
            satIsFleeing = true; satSpeedOffenses++; satCurrentSpeed = 0; satLastPos = null; satIsSwiping = false;
            const guideText = document.getElementById('sat-guide-text'); 
            if(guideText) guideText.classList.replace('text-white', 'text-red-400');
            
            if (satSpeedOffenses === 1) { if(guideText) guideText.innerText = "Too fast! They are hiding!"; vibe([50, 60, 50, 60, 50]); } 
            else { if(guideText) guideText.innerText = "Too fast twice! They ran away!"; vibe([100, 100, 100, 100, 100]); }
            
            satCoins.forEach(c => {
                if (!c.revealed) {
                    const cx = satCanvas.width / 2, cy = satCanvas.height / 2, dx = c.x - cx, dy = c.y - cy, dist = Math.hypot(dx, dy) || 1, runX = (dx / dist) * 800, runY = (dy / dist) * 800;
                    c.el.className = 'absolute w-16 h-16 md:w-20 md:h-20 flex items-center justify-center z-30 sat-panic'; c.el.style.setProperty('--run-tx', `${runX}px`); c.el.style.setProperty('--run-ty', `${runY}px`); c.sparkleEl.style.display = 'none'; 
                }
            });
            setTimeout(() => {
                if (currentDay !== 6 || satState !== 'playing') return;
                if (satSpeedOffenses === 1) {
                    fillSatFog();
                    satCoins.forEach(c => {
                        if (!c.revealed) {
                            c.x = 40 + Math.random() * (satCanvas.width - 80); c.y = 40 + Math.random() * (satCanvas.height - 80); c.el.className = 'absolute w-16 h-16 md:w-20 md:h-20 transition-all duration-500 transform scale-50 opacity-0 flex items-center justify-center pointer-events-none'; c.el.style.left = `${c.x - 32}px`; c.el.style.top = `${c.y - 32}px`; c.sparkleEl.style.left = `${c.x}px`; c.sparkleEl.style.top = `${c.y}px`; c.sparkleEl.style.display = 'block';
                        }
                    });
                    if(guideText) { guideText.innerText = "They hid again. Slowly..."; guideText.classList.replace('text-red-400', 'text-white'); }
                    satIsFleeing = false;
                } else { showModal("All Gone!", "You wiped too fast. They escaped. Zero rewards.", "I'll be slower", () => { satState = 'setup'; render(); }, 0); }
            }, 1200);
        }
        function satLoop() {
            if(currentDay !== 6 || satState !== 'playing') return;
            satCurrentSpeed *= 0.9; const bar = document.getElementById('sat-speed-bar'); const guide = document.getElementById('sat-guide-text');
            if (bar && !satIsFleeing) {
                let percent = Math.min(100, (satCurrentSpeed / SAT_MAX_SPEED) * 100); bar.style.width = percent + '%';
                if (percent > 85) { bar.style.backgroundColor = '#EF4444'; if(guide && satSpeedOffenses === 0) guide.innerText = "⚠️ Slow down!"; } 
                else if (percent > 50) { bar.style.backgroundColor = '#FBBF24'; if(guide && satSpeedOffenses === 0) guide.innerText = "Careful..."; } 
                else { bar.style.backgroundColor = '#34D399'; if(guide && satSpeedOffenses === 0) guide.innerText = "Speed: Safe"; }
            }
            satAnimId = requestAnimationFrame(satLoop);
        }

        // --- Sunday ---
        function renderSunday(scene) {
            if (sunState === 'setup') {
                scene.innerHTML = `<div class="glass-card p-6 flex flex-col items-center gap-3 w-72 md:w-80 text-center mx-auto scale-95 origin-center"><div class="h-28 w-full relative bg-blue-50 rounded-xl overflow-hidden border-2 border-gray-200"><div class="absolute w-10 h-10 flex items-center justify-center" style="animation: demoSunCoin 3s infinite linear;"><img src="" id="sun-demo-coin" class="w-full h-full object-contain"></div><div class="absolute bottom-2 w-16 h-6 bg-orange-400 rounded-b-xl rounded-t-sm" style="animation: demoSunBasket 3s infinite ease-in-out;"></div></div><h2 class="font-black text-base md:text-lg uppercase text-emerald-800 tracking-widest">Sunday Slumber</h2><p class="text-[11px] md:text-xs font-bold text-gray-600 leading-relaxed">Pure chill. Slide to catch.</p><button onclick="startSunGame()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-black text-base md:text-xl shadow-lg mt-1">Catch</button></div>`;
                setCoinImage(document.getElementById('sun-demo-coin'));
            } else {
                 scene.innerHTML = `<canvas id="sun-canvas" class="w-full h-full absolute inset-0 z-20 touch-none rounded-xl bg-gradient-to-b from-blue-100 to-indigo-50"></canvas><div id="sun-lives" class="absolute top-4 right-4 text-xl md:text-2xl z-30 tracking-widest drop-shadow-md">❤️❤️❤️</div>`;
                 sunCanvas = document.getElementById('sun-canvas'); sunCtx = sunCanvas.getContext('2d');
                 sunCanvas.width = scene.clientWidth; sunCanvas.height = scene.clientHeight; sunBasketX = sunCanvas.width / 2;
                 sunCanvas.onpointerdown = (e) => { sunCanvas.setPointerCapture(e.pointerId); const rect = sunCanvas.getBoundingClientRect(); sunBasketX = e.clientX - rect.left; };
                 sunCanvas.onpointermove = (e) => { e.preventDefault(); const rect = sunCanvas.getBoundingClientRect(); sunBasketX = e.clientX - rect.left; };
                 const coinImg = new Image(); let loopStarted = false;
                 const startLoop = () => { if (!loopStarted && sunState === 'playing') { loopStarted = true; sunLoop(coinImg); } };
                 coinImg.onload = startLoop; coinImg.onerror = startLoop; setCoinImage(coinImg); setTimeout(startLoop, 100); 
            }
        }
        function startSunGame() { startCountdown(() => { sunState = 'playing'; sunScore = 0; sunLives = 3; sunCoins = []; sunFrameCount = 0; render(); }); }
        function sunLoop(coinImg) {
            if(currentDay !== 7 || sunState !== 'playing') return;
            sunFrameCount++;
            const spawnRate = Math.max(50, 180 - Math.floor(sunScore / 2) * 8);
            if(sunFrameCount % spawnRate === 0) { sunCoins.push({ x: 30 + Math.random() * (sunCanvas.width - 60), y: -30, vy: 1.5 + (sunScore * 0.05), rot: 0 }); }
            sunCtx.clearRect(0, 0, sunCanvas.width, sunCanvas.height);
            const bw = 70, bh = 30, bx = Math.max(0, Math.min(sunCanvas.width - bw, sunBasketX - bw/2)), by = sunCanvas.height - 50;
            sunCtx.fillStyle = '#fb923c'; sunCtx.beginPath(); sunCtx.roundRect(bx, by, bw, bh, [5, 5, 20, 20]); sunCtx.fill(); sunCtx.strokeStyle = '#ea580c'; sunCtx.lineWidth = 4; sunCtx.stroke();
            for(let i = sunCoins.length - 1; i >= 0; i--) {
                let c = sunCoins[i]; c.y += c.vy; c.rot += 0.02;
                sunCtx.save(); sunCtx.translate(c.x, c.y); sunCtx.rotate(c.rot);
                if (coinImg.complete && coinImg.naturalWidth !== 0) { sunCtx.drawImage(coinImg, -25, -25, 50, 50); }
                sunCtx.restore();
                if(c.y + 15 > by && c.y - 15 < by + bh && c.x > bx - 15 && c.x < bx + bw + 15) { 
                    sunScore++; sunCoins.splice(i, 1); vibe([15]); 
                    const statVal = document.getElementById('stat-value');
                    if (statVal) statVal.innerText = sunScore; 
                    continue; 
                }
                if(c.y > sunCanvas.height + 30) {
                    sunCoins.splice(i, 1); sunLives--; 
                    const livesEl = document.getElementById('sun-lives');
                    if (livesEl) livesEl.innerText = '❤️'.repeat(Math.max(0, sunLives)); 
                    vibe([40, 40]);
                    if(sunLives <= 0) { sunState = 'gameover'; showModal("Bedtime!", `Caught ${sunScore} coins! Ready for Monday?`, "Claim", () => { sunState = 'setup'; render(); }, sunScore); }
                }
            }
            sunAnimId = requestAnimationFrame(() => sunLoop(coinImg));
        }

        function showModal(title, content, btnText, callback, rewardCoins = 0) {
            const modal = document.getElementById('game-modal'); const rewardDiv = document.getElementById('modal-reward'); const btn = document.getElementById('modal-btn');
            const titleEl = document.getElementById('modal-title');
            const contentEl = document.getElementById('modal-content');
            if (titleEl) titleEl.innerText = title; 
            if (contentEl) contentEl.innerHTML = content;
            
            if (rewardCoins > 0) {
                if (rewardDiv) rewardDiv.style.display = 'flex'; 
                const coinAmount = document.getElementById('modal-coin-amount');
                if (coinAmount) coinAmount.innerText = `+${rewardCoins}`;
                if (btn) btn.onclick = () => { const rect = btn.getBoundingClientRect(); animateCoinsToWallet(rewardCoins, rect); addLifeCoins(rewardCoins); if(modal) modal.style.display = 'none'; callback(); };
            } else { 
                if (rewardDiv) rewardDiv.style.display = 'none'; 
                if (btn) btn.onclick = () => { if(modal) modal.style.display = 'none'; callback(); }; 
            }
            if (btn) btn.innerText = btnText; 
            if (modal) modal.style.display = 'flex';
        }

        // 選擇心情顏色的過渡動畫邏輯
        function pickMood(day) {
            vibe([15]);
            const moodScreen = document.getElementById('mood-screen');
            if (moodScreen) {
                moodScreen.style.pointerEvents = 'none'; 
                moodScreen.style.opacity = '0';
            }
            setTimeout(() => {
                if (moodScreen) moodScreen.style.display = 'none';
                switchDay(day);
            }, 500);
        }

        // 移除了預設強制進入星期一的設定，等待玩家選擇顏色
        window.onload = () => {
            // Initialization can stay here if needed in the future
        };
    </script>
</body>
